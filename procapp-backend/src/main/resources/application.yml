spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/procapp
    username: postgres
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate   # schema comes from Flyway/your SQL files, never auto-generated
    open-in-view: false
  flyway:
    enabled: false   # you already applied V1__init_schema.sql manually via pgAdmin

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-hours: 10
  storage:
    attachments-dir: ${ATTACHMENTS_DIR:C:/procapp-data/attachments}
  cors:
    allowed-origins: http://localhost:5173

server:
  port: 8080